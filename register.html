<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CarRental</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
    <nav class="navbar">
        <div class="logo">
            <span class="logo-mark">
                <svg viewBox="0 0 64 40" width="42" height="28"
                    fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 25L13 14C14 11 17 9 21 9H43C47 9 50 12 51 15L55 25"
                        stroke="#ff6b00" stroke-width="3" stroke-linecap="round"/>
                    <path d="M5 25H59V32H5V25Z" fill="#ff6b00"/>
                    <path d="M17 14H47L51 24H13L17 14Z"
                        fill="#101820" stroke="#ff6b00" stroke-width="2"/>
                    <circle cx="17" cy="32" r="5" fill="white" stroke="#ff6b00" stroke-width="2"/>
                    <circle cx="47" cy="32" r="5" fill="white" stroke="#ff6b00" stroke-width="2"/>
                </svg>
            </span>
            <span class="logo-name">CAR<span class="logo-accent">RENTAL</span></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cars.html">Cars</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>


    <main class="auth-container">
    <div class="auth-card">

        <div class="auth-icon">👤</div>

        <p class="auth-tag">JOIN US TODAY</p>

        <h1>Create Your Account</h1>

        <p class="auth-description">
            Register today and enjoy a smooth car rental experience.
        </p>

        <form id="registerForm">

    <div class="auth-field">
        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required
        >
    </div>

    <div class="auth-field">
        <label for="password">Password</label>

        <div class="password-wrapper">
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                aria-label="Show password"
            >
                <svg id="eyeIcon"
                    xmlns="http://www.w3.org/2000/svg"
                    width="21"
                    height="21"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M3 3l18 18"/>
                    <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/>
                    <path d="M9.88 5.09A10.94 10.94 0 0 1 12 4.9c5 0 9 4.5 10 7.1a11.8 11.8 0 0 1-3 4.2"/>
                    <path d="M6.61 6.61A11.8 11.8 0 0 0 2 12c1 2.6 5 7.1 10 7.1a10.9 10.9 0 0 0 4-.75"/>
                </svg>
            </button>
        </div>
    </div>

    <button type="submit" class="auth-submit">
        Create Account →
    </button>

</form>
        <p class="auth-register">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>
</main>

    <footer>
        <p>© 2026 Car Rental Management Platform</p>
        <p>Team: The best one!!</p>
    </footer>


    <script>
const registerForm = document.getElementById("registerForm");

registerForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const user = {
        email: email,
        password: password,
        role: "customer"
    };

    localStorage.setItem("user", JSON.stringify(user));

    alert("Registration successful! 🎉");

    window.location.href = "login.html";
});

const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const eyeIcon = document.getElementById("eyeIcon");

togglePassword.addEventListener("click", function() {

    if (password.type === "password") {

        password.type = "text";
        togglePassword.setAttribute("aria-label", "Hide password");

        eyeIcon.innerHTML = `
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
        `;

    } else {

        password.type = "password";
        togglePassword.setAttribute("aria-label", "Show password");

        eyeIcon.innerHTML = `
            <path d="M3 3l18 18"/>
            <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"/>
            <path d="M9.88 5.09A10.94 10.94 0 0 1 12 4.9c5 0 9 4.5 10 7.1a11.8 11.8 0 0 1-3 4.2"/>
            <path d="M6.61 6.61A11.8 11.8 0 0 0 2 12c1 2.6 5 7.1 10 7.1a10.9 10.9 0 0 0 4-.75"/>
        `;

    }
});
    </script>

</body>

</html>
