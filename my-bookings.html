<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings - CarRental</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
<header>
    <nav class="navbar">

        <div class="logo">
            <span class="logo-mark">
                <svg viewBox="0 0 64 40" width="42" height="28"
                     fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 25L13 14C14 11 17 9 21 9H43C47 9 50 12 51 15L55 25"
                          stroke="#ff6b00" stroke-width="3" stroke-linecap="round"/>
                    <path d="M5 25H59V32H5V25Z" fill="#ff6b00"/>
                    <path d="M17 14H47L51 24H13L17 14Z"
                          fill="#101820" stroke="#ff6b00" stroke-width="2"/>
                    <circle cx="17" cy="32" r="5" fill="white" stroke="#ff6b00" stroke-width="2"/>
                    <circle cx="47" cy="32" r="5" fill="white" stroke="#ff6b00" stroke-width="2"/>
                </svg>
            </span>
            <span class="logo-name">CAR<span class="logo-accent">RENTAL</span></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cars.html">Cars</a></li>
            <li><a href="my-bookings.html">My Bookings</a></li>
        </ul>

    </nav>
</header>


    <!-- My Bookings -->
    <main class="bookings-container">

        <h1>My Bookings</h1>

        <p class="booking-subtitle">
            View your car rental bookings and their current status.
        </p>

        <div id="bookingsList"></div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Car Rental Management Platform</p>
        <p>Team: The best one!!</p>
    </footer>


    <script>

        // Get saved bookings
        const bookings =
            JSON.parse(localStorage.getItem("bookings")) || [];

        const bookingsList =
            document.getElementById("bookingsList");


        // Check if there are no bookings
        if (bookings.length === 0) {

            bookingsList.innerHTML =
                "<p>No bookings found.</p>";

        } else {

            // Display every booking
            bookings.forEach(function(booking, index) {

                const bookingCard =
                    document.createElement("div");

                bookingCard.className = "booking-item";

                bookingCard.innerHTML = `
                    <h2 class="booking-car-title">
    <span class="booking-car-icon">
        <svg viewBox="0 0 64 40" width="38" height="26"
             fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 25L13 14C14 11 17 9 21 9H43C47 9 50 12 51 15L55 25"
                  stroke="#ff6b00" stroke-width="3" stroke-linecap="round"/>
            <path d="M5 25H59V32H5V25Z" fill="#ff6b00"/>
            <path d="M17 14H47L51 24H13L17 14Z"
                  fill="#101820" stroke="#ff6b00" stroke-width="2"/>
            <circle cx="17" cy="32" r="5" fill="white" stroke="#ff6b00" stroke-width="2"/>
            <circle cx="47" cy="32" r="5" fill="white" stroke="#ff6b00" stroke-width="2"/>
        </svg>
    </span>
    ${booking.car}
</h2>

                    <p><strong>Name:</strong> ${booking.name}</p>

                    <p><strong>Email:</strong> ${booking.email}</p>

                    <p><strong>Phone:</strong> ${booking.phone}</p>

                    <p><strong>Pickup:</strong> ${booking.pickup}</p>

                    <p><strong>Return:</strong> ${booking.returnDate}</p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status">
                            ${booking.status}
                        </span>
                    </p>
                `;

                bookingsList.appendChild(bookingCard);

            });

        }

    </script>

</body>

</html>
